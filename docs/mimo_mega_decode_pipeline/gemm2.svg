   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="425.7" y="160.085344" transform="rotate(-0 425.7 160.085344)">W2 FP4 + B scales: global -&gt; registers directly. A2 scales: global -&gt; register prefetch.</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="425.7" y="211.630656" transform="rotate(-0 425.7 211.630656)">1. Prefetch B(k+1), B-scale(k+1), A2-scale(k+1) -&gt; next register state</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="425.7" y="264.298656" transform="rotate(-0 425.7 264.298656)">2. Barrier; LDS A(k) -&gt; operand regs; VMEM A(k+2) -&gt; regs -&gt; free LDS slot</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="425.7" y="316.813687" transform="rotate(-0 425.7 316.813687)">3. prepare_b(K128) once; reuse across two M16 fragments; native MFMA K32</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="425.7" y="369.634656" transform="rotate(-0 425.7 369.634656)">4. Rotate B/scale SSA state and A ring; next K256 iteration</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(180.721875 438.080344)">K256 x 8 for I2048. Early per-K32 scaling; s_setprio / sched_barrier around MFMA.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(157.015312 451.851469)">Epilogue: FP32 regs -&gt; LDS Cshuffle -&gt; route-weight multiply -&gt; BF16 -&gt; P2P store issue.</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'" transform="translate(135.676875 465.288844)">Sequential instructions are software-interleaved; actual stalls require a current instruction trace.</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle" x="425.7" y="20.117344" transform="rotate(-0 425.7 20.117344)">GEMM2: triple-buffered A in LDS + double-buffered B in registers</text>
   </g>
  </g>
